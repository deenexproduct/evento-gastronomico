<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Reglas de la grilla -->
  <rect x="0" y="0" width="1200" height="6" fill="#695EDE"/>
  <line x1="64" y1="112" x2="1136" y2="112" stroke="#E4E2EE" stroke-width="1"/>
  <line x1="64" y1="452" x2="1136" y2="452" stroke="#E4E2EE" stroke-width="1"/>

  <!-- Cabecera -->
  <text x="64" y="80" font-family="Inter, system-ui, sans-serif" font-size="17"
        font-weight="700" letter-spacing="2.6" fill="#5348C9">EL EVENTO DE DEENEX</text>
  <text x="1136" y="80" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="17"
        font-weight="600" letter-spacing="2.6" fill="#5F5C73">CÓRDOBA · 20.09.2026</text>

  <!-- Titular -->
  <text x="64" y="228" font-family="Inter, system-ui, sans-serif" font-size="86"
        font-weight="600" letter-spacing="-4.2" fill="#15132A">El evento de</text>
  <text x="64" y="322" font-family="Inter, system-ui, sans-serif" font-size="86"
        font-weight="600" letter-spacing="-4.2" fill="#15132A">gastronomía</text>
  <text x="64" y="416" font-family="Inter, system-ui, sans-serif" font-size="86"
        font-weight="600" letter-spacing="-4.2" fill="#5348C9">y tecnología.</text>

  <!-- Bajada -->
  <text x="64" y="508" font-family="Inter, system-ui, sans-serif" font-size="24"
        font-weight="400" fill="#5F5C73">Un día entero de charlas, demos en vivo y networking para dueños de</text>
  <text x="64" y="544" font-family="Inter, system-ui, sans-serif" font-size="24"
        font-weight="400" fill="#5F5C73">marcas gastronómicas y restaurantes. Hotel Quinto Centenario, 9 a 18 h.</text>

  <!-- Datos -->
  <text x="64" y="596" font-family="Inter, system-ui, sans-serif" font-size="16"
        font-weight="700" letter-spacing="2.2" fill="#5348C9">ENTRADA GRATUITA · REGISTRO PREVIO · 200 LUGARES</text>

  <!-- Bloque violeta -->
  <rect x="930" y="150" width="206" height="266" fill="#695EDE"/>
  <text x="1033" y="268" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="82" font-weight="600" letter-spacing="-3.6" fill="#ffffff">200</text>
  <text x="1033" y="308" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="15" font-weight="700" letter-spacing="2.4" fill="#ffffff" fill-opacity="0.85">LUGARES</text>
  <line x1="978" y1="334" x2="1088" y2="334" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <text x="1033" y="368" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="15" font-weight="600" letter-spacing="1.4" fill="#ffffff" fill-opacity="0.85">Cupo real,</text>
  <text x="1033" y="392" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
