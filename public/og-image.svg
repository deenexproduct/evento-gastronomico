    <text x="128" y="176" text-anchor="middle" font-family="Archivo, system-ui, sans-serif"
          font-size="16" font-weight="800" letter-spacing="2.6" fill="#ffffff" fill-opacity="0.75">NO MÁS</text>
  </g>
