  <text x="40" y="528" font-family="Archivo, system-ui, sans-serif" font-size="21"
        font-weight="500" fill="#ffffff" fill-opacity="0.55">Datos · IA · Sistemas POS · Contenido · Ecosistema</text>

  <!-- Franja inferior -->
  <rect x="0" y="562" width="1200" height="68" fill="#E8FF4A"/>
  <text x="40" y="605" font-family="Archivo Black, Archivo, sans-serif" font-size="27"
        letter-spacing="-0.6" fill="#101010">EL EVENTO DE DEENEX</text>
  <text x="1160" y="605" text-anchor="end" font-family="Archivo Black, Archivo, sans-serif"
