<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#101010"/>

  <!-- Franja superior -->
  <rect x="0" y="0" width="1200" height="54" fill="#E8FF4A"/>
  <text x="40" y="35" font-family="Archivo, system-ui, sans-serif" font-size="16"
        font-weight="800" letter-spacing="2.6" fill="#101010">DOMINGO 20.09.2026 · CÓRDOBA</text>
  <text x="1160" y="35" text-anchor="end" font-family="Archivo, system-ui, sans-serif"
        font-size="16" font-weight="800" letter-spacing="2.6" fill="#101010">ENTRADA GRATUITA</text>

  <!-- Titular -->
  <text x="40" y="205" font-family="Archivo Black, Archivo, sans-serif" font-size="112"
        font-weight="900" letter-spacing="-5" fill="#ffffff">NO VENÍS</text>
  <text x="40" y="313" font-family="Archivo Black, Archivo, sans-serif" font-size="112"
        font-weight="900" letter-spacing="-5" fill="none" stroke="#ffffff" stroke-width="2">A ESCUCHAR</text>
  <text x="40" y="421" font-family="Archivo Black, Archivo, sans-serif" font-size="112"
        font-weight="900" letter-spacing="-5" fill="#ffffff">CHARLAS.</text>

  <!-- Bajada -->
  <text x="40" y="492" font-family="Archivo, system-ui, sans-serif" font-size="27"
        font-weight="600" fill="#E8FF4A">Te vas con un diagnóstico de tu negocio.</text>
  <text x="40" y="532" font-family="Archivo, system-ui, sans-serif" font-size="21"
        font-weight="500" fill="#ffffff" fill-opacity="0.55">Innovación, tecnología y marketing para el mercado gastronómico.</text>

  <!-- Franja inferior -->
  <rect x="0" y="562" width="1200" height="68" fill="#E8FF4A"/>
  <text x="40" y="605" font-family="Archivo Black, Archivo, sans-serif" font-size="27"
        letter-spacing="-0.6" fill="#101010">EL EVENTO DE DEENEX</text>
  <text x="1160" y="605" text-anchor="end" font-family="Archivo Black, Archivo, sans-serif"
        font-size="27" letter-spacing="-0.6" fill="#101010">HOTEL QUINTO CENTENARIO · 9 A 18 H</text>

  <!-- Bloque de cupo -->
  <g transform="translate(905, 150)">
    <rect width="255" height="215" fill="#FF4A2E"/>
    <text x="128" y="105" text-anchor="middle" font-family="Archivo Black, Archivo, sans-serif"
          font-size="94" letter-spacing="-4" fill="#ffffff">200</text>
    <text x="128" y="146" text-anchor="middle" font-family="Archivo, system-ui, sans-serif"
          font-size="16" font-weight="800" letter-spacing="2.6" fill="#ffffff">LUGARES</text>
    <text x="128" y="176" text-anchor="middle" font-family="Archivo, system-ui, sans-serif"
          font-size="16" font-weight="800" letter-spacing="2.6" fill="#ffffff" fill-opacity="0.75">NO MÁS</text>
  </g>
</svg>
