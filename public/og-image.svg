<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#101010"/>

  <!-- Franja superior -->
  <rect x="0" y="0" width="1200" height="54" fill="#E8FF4A"/>
  <text x="40" y="35" font-family="Archivo, system-ui, sans-serif" font-size="16"
        font-weight="800" letter-spacing="2.6" fill="#101010">DOMINGO 20.09.2026 · CÓRDOBA · 9 A 18 H</text>
  <text x="1160" y="35" text-anchor="end" font-family="Archivo, system-ui, sans-serif"
        font-size="16" font-weight="800" letter-spacing="2.6" fill="#101010">ENTRADA GRATUITA</text>

  <!-- Titular -->
  <text x="40" y="196" font-family="Archivo Black, Archivo, sans-serif" font-size="96"
        font-weight="900" letter-spacing="-4.2" fill="#ffffff">EL EVENTO DE</text>
  <text x="40" y="290" font-family="Archivo Black, Archivo, sans-serif" font-size="96"
        font-weight="900" letter-spacing="-4.2" fill="#ffffff">GASTRONOMÍA</text>
  <text x="40" y="384" font-family="Archivo Black, Archivo, sans-serif" font-size="96"
        font-weight="900" letter-spacing="-4.2" fill="none" stroke="#E8FF4A" stroke-width="2">Y TECNOLOGÍA.</text>

  <!-- Bajada -->
  <text x="40" y="456" font-family="Archivo, system-ui, sans-serif" font-size="25"
