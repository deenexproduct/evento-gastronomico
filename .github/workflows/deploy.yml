name: Deploy a GitHub Pages

on:
  push:
    # La landing publicada sale de esta rama. main quedó con otra versión del
    # sitio —13 secciones distintas, trabajo de otra línea de edición— y las
    # dos no son mergeables: no comparten un solo componente de sección.
    branches: [feat/rediseno-investigacion]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy por vez; no se cancelan los que ya están corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GITHUB_PAGES activa el base "/evento-gastronomico/" de vite.config.js
      - run: npm run build
        env:
          GITHUB_PAGES: "true"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
